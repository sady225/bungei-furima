<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; media-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>出店者紹介｜沖縄文芸フリマ</title>

<body>
<header><a href="../">沖縄文芸フリマへ戻る</a><p class="eyebrow">つくる・伝える・つながる</p><h1>出店者のご紹介</h1><p>作品の向こうにいる、つくり手に出会う。</p></header>
<main>
  <div class="filters"><label for="event">開催回</label><select id="event"><option value="">すべての開催回</option></select></div>
  <p id="status" role="status" aria-live="polite">紹介を読み込んでいます。</p>
  <div id="cards" class="grid"></div>
  <noscript>出店者紹介の表示にはJavaScriptを有効にしてください。</noscript>
</main>
<footer><p>掲載同意と運営の確認を経た紹介を掲載しています。</p><p>紹介の修正・掲載停止は、公式サイトに記載の運営窓口へお知らせください。</p><a href="../">公式サイトの案内・お問い合わせへ</a></footer>

</html>
