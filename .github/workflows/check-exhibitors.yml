name: Check exhibitor publication changes
on:
  pull_request:
  push:
    branches: ["feat/exhibitor-approval-20261030"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install safety-check prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - run: node --test integrations/exhibitors/tests/*.test.mjs
      - run: bash scripts/check-site-safety.sh
      - run: git diff --check
